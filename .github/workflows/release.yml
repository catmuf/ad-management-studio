name: Cleanup GitHub Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  delete-all-releases:
    name: Delete All GitHub Releases and Disable Wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete All Releases via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDS=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate -q '.[].id')
          for ID in $IDS; do
            echo "Deleting GitHub release ID: $ID"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${ID}"
          done
          echo "Remaining releases:"
          gh api "repos/${GITHUB_REPOSITORY}/releases" -q 'length'

      - name: Attempt to Disable Wiki Setting
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -f has_wiki=false || true
