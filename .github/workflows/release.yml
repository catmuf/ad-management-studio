name: Publish GitHub Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  sync-all-releases:
    name: Publish All Historical Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish All Releases to GitHub
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS=("v0.1.0" "v1.0.0" "v2.0.0" "v2.1.0" "v2.2.0" "v2.3.0" "v2.4.0" "v3.0.0" "v3.1.0" "v3.2.0" "v3.3.0")
          
          for TAG in "${VERSIONS[@]}"; do
            echo "----------------------------------------------------"
            echo "Processing GitHub Release for: $TAG"
            echo "----------------------------------------------------"
            
            NOTES_FILE="docs/releases/${TAG}.md"
            TITLE="Active Directory Management Studio ${TAG} (Enterprise Edition)"
            
            if [ ! -f "$NOTES_FILE" ]; then
              NOTES_FILE="CHANGELOG.md"
            fi
            
            EXTRA_FLAGS=""
            if [ "$TAG" = "v0.1.0" ]; then
              EXTRA_FLAGS="--prerelease"
            elif [ "$TAG" = "v3.3.0" ]; then
              EXTRA_FLAGS="--latest"
            fi
            
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists on GitHub. Updating..."
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" $EXTRA_FLAGS
            else
              echo "Creating new release $TAG on GitHub..."
              gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" $EXTRA_FLAGS
            fi
            echo "Release $TAG successfully published!"
          done
          
          echo "===================================================="
          echo "All 11 GitHub Releases synchronized successfully!"
          echo "===================================================="
